name: Release AuditSpace (Rust / Tauri 2.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuditSpace ${{ github.ref_name }}'
          releaseBody: |
            ## AuditSpace ${{ github.ref_name }} (Rust / Tauri 2.0 Engine)

            🎉 Rilis resmi pembaruan fitur **AuditSpace ${{ github.ref_name }}**:

            ### ✨ Apa yang Baru di Versi Ini:
            1. **Diferensiasi Kolom To-Do vs In-Progress**:
               - Kolom To-Do dan In-Progress kini dipisah dengan status badge jelas.
               - Tombol aksi cepat **`▶ Mulai Kerjakan`** memindahkan tugas secara instan.
               - Tugas In-Progress memiliki badge berdenyut aktif **`● Sedang Berjalan`** dan border aktif.
            2. **Bebas Kustomisasi & Tambah Kolom**:
               - Seluruh judul kolom bawaan dapat diubah namanya (rename).
               - Tersedia tombol **`+ Tambah Kotak / Kolom Baru`** untuk membuat kolom kustom dengan kartu kustom sendiri.
            3. **Scrollbar Horizontal Tebal & Eye-Catching**:
               - Scrollbar 12px dengan warna gradien modern, ditambah tombol navigasi **`[ ◀ Geser ]`** dan **`[ Geser ▶ ]`**.
            4. **Kolaborasi Langsung P2P (WebRTC Live Share)**:
               - Fitur **`[ 📡 Kolaborasi P2P ]`** untuk membagikan ruang kerja langsung antar laptop AuditSpace via kode 6-digit.
               - Mendukung mode **Peninjau (Read-Only)** dan mode **Editor (Read-Write)**.
            5. **Ekspor Dasbor Interaktif (.html)**:
               - Tersedia di menu *Alat & Laporan* untuk mengunduh 1 file HTML eksekutif mandiri yang bisa dibuka di browser apa saja tanpa instalasi (100% Read-Only).
          releaseDraft: false
          prerelease: false
