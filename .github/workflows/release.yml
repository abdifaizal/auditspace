name: Release AuditSpace (Rust / Tauri 2.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuditSpace ${{ github.ref_name }}'
          releaseBody: |
            ## AuditSpace ${{ github.ref_name }} (Rust / Tauri 2.0 Engine)

            🎉 Rilis resmi pembaruan fitur **AuditSpace ${{ github.ref_name }}**:

            ### ✨ Apa yang Baru di Versi Ini:
            1. **Bullet List, Numbering & Checkbox pada Catatan Tempel**:
               - Catatan Tempel kini otomatis merapikan daftar bertitik (bullet •), penomoran urut angka (1.), checkbox to-do ([ ]), dan pemformatan tebal (**bold**).
            2. **Penyisipan Gambar & Screenshot di Antara Teks Catatan**:
               - Menyisipkan bukti gambar/screenshot di dalam catatan via tombol *Sisipkan Gambar* atau langsung tempel gambar (**Ctrl+V**) dari clipboard.
               - Dilengkapi tab *Tulis* & *Pratinjau*, serta fitur perbesar gambar (*Lightbox Zoom*).
            3. **Tata Letak Header Responsif & Dukungan Split-Screen Windows (min-width 960px)**:
               - Saat jendela dikecilkan atau dibagi 50:50 (split-screen), tombol Space, View Switcher, P2P, Alat, Tambah, Export, Import, dan Dark Mode beradaptasi secara cerdas sehingga 100% tetap terlihat dan tidak ada yang terpotong.
            4. **Segmented Switcher & Pemisah Kontrol Tampilan**:
               - Switcher mode tampilan ("Infinite Canvas" vs "Modular Kanban") diperbarui menjadi kontrol tersegmentasi berkontras tinggi dengan garis pemisah vertikal (*divider*).
            5. **Tombol Geser Kanban Jelas & Interaktif**:
               - Tombol navigasi scroll Kanban diubah menjadi 2 tombol aksi mandiri berborder nyata: `[ ‹ Geser Kiri ]` dan `[ Geser Kanan › ]` dengan ikon chevron biru dan efek hover aktif.
            6. **Perbaikan Penuh Mesin Dark Mode**:
               - Mendukung Tailwind v4 dark-variant, otomatis mendeteksi tema Windows, menyimpan preferensi tema di `localStorage`, dan palet warna Catatan Tempel (*Sticky Notes*) yang nyaman di mata pada mode gelap.
            7. **Sinkronisasi Logo Resmi Brand AuditSpace**:
               - Logo di header aplikasi dan kop surat kertas kerja audit diseragamkan dengan ikon aplikasi resmi.
            8. **Native Browser Launcher & Unduh Pembaruan**:
               - Tombol Unduh Pembaruan dan tautan installer di Auto-Updater langsung membuka browser bawaan Windows via process launcher Rust.
            9. **Native Save File Dialog & Export Fix**:
               - Tombol Export dan unduh berkas memanggil dialog bawaan Windows "Save As" secara andal melalui Rust engine.
            10. **Ikon Installer EXE Konsisten**:
               - Berkas installer setup (.exe) menggunakan ikon kustom resmi AuditSpace yang sama persis dengan ikon aplikasi terpasang.
          releaseDraft: false
          prerelease: false
