name: Release AuditSpace (Rust / Tauri 2.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuditSpace ${{ github.ref_name }}'
          releaseBody: |
            ## AuditSpace ${{ github.ref_name }} (Rust / Tauri 2.0 Engine)

            🎉 Rilis resmi pembaruan fitur **AuditSpace ${{ github.ref_name }}**:

            ### ✨ Apa yang Baru di Versi Ini:
            1. **Native Save File Dialog & Export Fix**:
               - Tombol Export dan unduh berkas kini memanggil dialog bawaan Windows "Save As" secara andal melalui Rust engine.
            2. **Ikon Installer EXE Konsisten**:
               - Berkas installer setup (.exe) kini menggunakan ikon kustom resmi AuditSpace yang sama persis dengan ikon aplikasi terpasang.
            3. **Versi Aplikasi di Title Bar**:
               - Judul title bar aplikasi Windows kini menampilkan versi aplikasi secara jelas (contoh: `AuditSpace v1.0.2 - Workspace`).
            4. **Solusi 403 Rate-Limit pada Auto-Updater**:
               - Mengatasi batas kuota GitHub API 403 dengan fallback otomatis ke jaringan CDN mentah.
            5. **Dukungan Berkas Lengkap pada Agenda**:
               - Mendukung multi-lampiran: Excel daftar hadir, transkrip teks .txt/.log, dokumen Word, dan surat undangan PDF.
            6. **Edit Tautan & Pemisahan Tombol**:
               - Tautan di Materi Auditee kini dapat diedit dengan tombol pensil ✏️ dan tombol Tambah URL telah dipisahkan posisinya.
            7. **Drag & Drop Berkas**:
               - Drag-and-drop PDF dan dokumen langsung ke workspace dan modal tanpa kendala.
          releaseDraft: false
          prerelease: false
