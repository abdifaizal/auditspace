name: Release AuditSpace (Rust / Tauri 2.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Extract Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content -Raw CHANGELOG.md
          $pattern = "(?s)##\s*\[?" + [regex]::Escape($tag) + "\]?[^\n]*\n(.*?)(?=\n##|\Z)"
          if ($content -match $pattern) {
            $notes = "## AuditSpace v$tag (Rust / Tauri 2.0 Engine)`n`n" + $matches[1].Trim()
          } else {
            $notes = "## AuditSpace v$tag`n`nPembaruan fitur dan stabilitas AuditSpace."
          }
          $notes | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuditSpace ${{ github.ref_name }}'
          releaseBodyFile: 'release_notes.md'
          releaseDraft: false
          prerelease: false
