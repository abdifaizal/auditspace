name: Release AuditSpace (Rust / Tauri 2.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuditSpace ${{ github.ref_name }}'
          releaseBody: |
            ## AuditSpace ${{ github.ref_name }} (Rust / Tauri 2.0 Engine)

            🎉 Rilis resmi pembaruan fitur **AuditSpace ${{ github.ref_name }}**:

            ### ✨ Apa yang Baru di Versi Ini:
            1. **In-App Auto-Updater (Download & Install Tanpa Browser)**:
               - Pembaruan aplikasi kini dapat diunduh dan dipasang langsung di dalam dialog aplikasi tanpa harus membuka browser atau mencari berkas installer di folder Downloads.
            2. **Pembersihan & Perapian Catatan Rilis**:
               - Catatan rilis di GitHub Releases kini modular dan spesifik per versi tanpa duplikasi dari rilis-rilis sebelumnya.
               - Dokumentasi resmi riwayat perubahan kini tersedia di berkas `CHANGELOG.md`.
          releaseDraft: false
          prerelease: false
