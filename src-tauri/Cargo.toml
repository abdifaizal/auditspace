[package]
name = "auditspace"
version = "1.0.12"
description = "AuditSpace - Productivity workspace for audit engagements"
authors = ["abdifaizal"]
license = "MIT"
repository = "https://github.com/abdifaizal/auditspace"
edition = "2021"

[lib]
name = "auditspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
rfd = "0.15"
